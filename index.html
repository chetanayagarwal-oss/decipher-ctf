<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DECIPHER — Campus CTF</title>
<meta name="description" content="DECIPHER — a campus-wide Capture The Flag. Find the flag, submit it, score. No experience needed." />
<meta property="og:title" content="DECIPHER — Campus CTF" />
<meta property="og:description" content="Crack the cipher. Climb the board. Claim the flag." />
<meta name="theme-color" content="#08010f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2310002b'/%3E%3Ctext x='50' y='68' font-size='48' text-anchor='middle' fill='%2300ffcc' font-family='monospace' font-weight='bold'%3E%7B%3A%7D%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;500;600;700&family=Syncopate:wght@400;700&family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/arcade.css?v=12" />
</head>
<body>

<div id="stage"></div>

<!-- ================== BOOT / LOADING ================== -->
<div class="boot" id="boot">
  <div class="boot-inner">
    <p class="boot-eyebrow">CAMPUS CTF <span class="s">//</span> <span data-date-label>—</span></p>
    <h1 class="boot-title">DECIPHER</h1>
    <div class="boot-bar"><div class="boot-bar-fill" id="boot-fill"></div></div>
    <p class="boot-status" id="boot-status">powering up cabinet…</p>
    <button class="boot-start" id="boot-start" hidden>PRESS START</button>
  </div>
</div>

<!-- ================== HUD ================== -->
<header class="hud hud-top">
  <a class="wordmark" href="./" aria-label="Decipher">
    <span class="wm-mark">{:}</span><span class="wm-text">DECIPHER</span>
  </a>
  <div class="hud-meta">
    <div class="countdown" id="countdown" role="timer" aria-label="Time until event">
      <span class="cd-cell"><b id="cd-d">--</b><i>D</i></span>
      <span class="cd-cell"><b id="cd-h">--</b><i>H</i></span>
      <span class="cd-cell"><b id="cd-m">--</b><i>M</i></span>
      <span class="cd-cell"><b id="cd-s">--</b><i>S</i></span>
    </div>
    <p class="hud-date"><span data-date-label>—</span> <span class="s">·</span> <span data-venue>—</span></p>
  </div>
</header>

<aside class="readout hud" id="readout" aria-live="polite">
  <div class="ro-frame">
    <p class="ro-eyebrow" id="ro-eyebrow"></p>
    <p class="ro-body" id="ro-body"></p>
    <p class="ro-step" id="ro-step"></p>
  </div>
</aside>

<footer class="hud hud-bottom">
  <p class="hud-hint" id="hud-hint">CLICK THE JOYSTICK OR BUTTONS TO READ ON</p>
  <div class="hud-actions" style="position: absolute; left: 49.6%; transform: translateX(-50%); bottom: 22px;">
    <a class="btn btn-solid" id="register-btn" href="https://decipher2026.tech/teams" target="_blank" rel="noopener noreferrer">REGISTER</a>
  </div>
  <button class="hud-sound" id="sound-btn" aria-label="Toggle sound">♪ ON</button>
</footer>

<div class="fail" id="fail" hidden>
  <p>This browser couldn't start WebGL, so the cabinet can't render.</p>
  <p class="fail-sub">Try a different browser, or ask an organizer for the rules sheet.</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script src="/js/config.js"></script>
<script type="module" src="/js/arcade.js?v=12"></script>
</body>
</html>
